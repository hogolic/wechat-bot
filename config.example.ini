# DeepSeek × 微信机器人 —— 配置示例
# 复制成 config.ini 后填自己的值。不要把填好的 config.ini 提交到仓库。

[deepseek]
# 任意 OpenAI 兼容接口；下面默认是 SiliconFlow
base_url = https://api.siliconflow.cn/v1
api_key =
model = deepseek-ai/DeepSeek-V4.1-Flash
temperature = 1.3
max_tokens = 2000
timeout = 45


[wechat]
# 监听名单：填微信备注名/昵称；留空 + listen_all = true 表示全部
listen_list = 文件传输助手
listen_all = false

# 群聊
listen_groups = true
reply_groups = true
trigger = all
trigger_prefix =
at_names = 小D

send_verify = false
reply_delay = 1.0
split_limit = 900
plain_text = true
error_reply = true


[proactive]
enabled = false
groups =
mode = balanced
active_hours = 9-23
min_interval = 240
daily_max = 20
min_messages = 6
min_speakers = 2
probability = 0.12
keyword_probability = 0.35
keywords = 小D
max_chars = 60


[voice]
# edge-tts 语音条
enabled = true
voice = zh-CN-XiaoxiaoNeural
rate =
pitch =
max_chars = 200


[sing]
# 唱歌：Seed-VC 换声 + 本地曲库
enabled = true

# 参考音：放你自己有权使用的声音
ref = tools/data/refs/ref.wav

# 曲库：<歌名>/vocals.wav + instrumental.wav
songs_dir = tools/data/songs

# 只说「唱首歌」时用哪首；留空会反问歌名
default =

send_mode = split_voice
with_music = false
max_segment = 19

# 每首歌最多唱多少秒（0 = 整首）
max_seconds = 60
# auto = 从 30% 处开始（副歌附近）；head = 从头
clip_start = auto

diffusion_steps = 30

# 收件箱：手动丢 mp3 进来，发「扫歌」入库
auto_ingest = false
inbox_dir = tools/data/music_inbox
ingest_interval = 20


[netease]
# 曲库没有时自动搜歌、下载、分离
enabled = true

# 网易云 Cookie 里的 MUSIC_U；留空只能下免费歌
cookie =

search_limit = 10


[memory]
# 只读共用 Aurabot（QQ 插件）的记忆；默认关闭
enabled = false
file =
owner_qq =
top_k = 6
chats =


[bot]
name = 小D
max_history = 16


[persona]
system_file = personas/default.txt
